<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. Use @font-face in CSS</title>
    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('fonts/myFont.woff2') format('woff2'),
                 url('fonts/myFont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'MyCustomFont', sans-serif;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1>Hello, this is MyCustomFont!</h1>
</body>
</html>
